<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p>Real-time weather information</p>
        </header>

        <div class="search-section">
            <input type="text" id="cityInput" placeholder="Enter city name..." />
            <button onclick="searchWeather()">Search</button>
            <button onclick="getCurrentLocation()">📍 My Location</button>
        </div>

        <div id="error" class="error" style="display:none;"></div>

        <div id="currentWeather" class="weather-card" style="display:none;">
            <div class="weather-header">
                <div>
                    <h2 id="cityName"></h2>
                    <p id="weatherDescription"></p>
                </div>
                <img id="weatherIcon" src="" alt="Weather icon" />
            </div>
            <div class="weather-details">
                <div class="detail">
                    <span class="label">Temperature</span>
                    <span id="temperature" class="value"></span>
                </div>
                <div class="detail">
                    <span class="label">Feels Like</span>
                    <span id="feelsLike" class="value"></span>
                </div>
                <div class="detail">
                    <span class="label">Humidity</span>
                    <span id="humidity" class="value"></span>
                </div>
                <div class="detail">
                    <span class="label">Pressure</span>
                    <span id="pressure" class="value"></span>
                </div>
                <div class="detail">
                    <span class="label">Wind Speed</span>
                    <span id="windSpeed" class="value"></span>
                </div>
                <div class="detail">
                    <span class="label">Visibility</span>
                    <span id="visibility" class="value"></span>
                </div>
            </div>
        </div>

        <div id="airQuality" class="air-quality-card" style="display:none;">
            <h3>Air Quality</h3>
            <div class="air-quality-content">
                <div class="aq-item">
                    <span class="label">AQI Level</span>
                    <span id="aqi" class="value"></span>
                </div>
                <div class="aq-item">
                    <span class="label">PM2.5</span>
                    <span id="pm25" class="value"></span>
                </div>
                <div class="aq-item">
                    <span class="label">PM10</span>
                    <span id="pm10" class="value"></span>
                </div>
                <div class="aq-item">
                    <span class="label">O3</span>
                    <span id="o3" class="value"></span>
                </div>
            </div>
        </div>

        <div id="forecast" class="forecast-section" style="display:none;">
            <h3>5-Day Forecast</h3>
            <div id="forecastCards" class="forecast-cards"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
